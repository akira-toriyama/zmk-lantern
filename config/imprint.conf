# Read by both imprint_left and imprint_right (ZMK reads the conf of every
# shield-name prefix): the lines a consumer's half conf carries for the module.
# Roles are Cyboard's defaults (the left half is the split central); the
# module does not care, and the right half covers the split peripheral, where
# ZMK enables the USB device stack on nRF52840 without ZMK_USB. The rail, the
# strip and the keys: config/imprint.overlay.

# The module paints the key LEDs itself (src/keys.c, the lantern,keys node),
# so ZMK's underglow stays off: its tick would repaint the strip
# (src/keys.c asserts this line). Cyboard's module defaults it to y.
CONFIG_ZMK_RGB_UNDERGLOW=n

# On by default with the lantern,keys and lantern,rail nodes; written out so
# that a grep of build/*/zephyr/.config reads as intended.
CONFIG_LANTERN_KEYS=y
CONFIG_LANTERN_ON_USB_POWER=y

# CONFIG_LANTERN_OFF_WHEN_IDLE (default y) reads ZMK's activity state: five
# minutes without a key, sensor or pointing input on the half, and its LEDs go
# dark on USB too (ZMK's default is 30 s; canon's halves set the same five).
CONFIG_ZMK_IDLE_TIMEOUT=300000
