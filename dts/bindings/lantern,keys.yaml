description: |
  The key LEDs zmk-lantern paints (CONFIG_LANTERN_KEYS, src/keys.c): the LED
  strip under the keys and the key each LED sits under, and where the
  consumer says so the palette slot each key shows in the bands, the
  default picture, and where each key is. Exactly one per target with key
  LEDs (a split half); a target without one (a dongle) builds none of the
  painting. ZMK's underglow stays off on such a target: this module is the
  strip's one writer.

compatible: "lantern,keys"

include: base.yaml

properties:
  strip:
    type: phandle
    required: true
    description: |
      The LED strip device (a worldsemi,ws2812-spi node, or any Zephyr
      led_strip driver). Its chain-length is the LED count: the consumer sets
      it to the real number of LEDs (the WS2812 SPI driver sends and buffers
      the whole chain-length at every frame), and positions has one entry
      per LED.

  positions:
    type: array
    required: true
    description: |
      One entry per LED, in the chain's order: the key position the LED sits
      under, an index into the keymap (the longest physical layout's map
      where the keyboard has layouts, else the chosen matrix transform's;
      global across a split) and into slots. Measured on the hardware, one
      LED at a time (canon t-69g7).

  slots:
    type: array
    description: |
      One entry per key position, in position order (the whole keymap, both
      halves of a split): the palette slot, 0 to 5, the key's LED shows in
      the bands (CONFIG_LANTERN_BANDS, the default picture, and the bands
      intro, CONFIG_LANTERN_INTRO_BANDS, the boot light's default), and the
      colour of the crossing ring and the beams from that key. The length
      is the keymap's (ZMK_KEYMAP_LEN, asserted), so a table written in the
      keymap's shape reads as the bands. Without it every key is slot 0:
      the bands one colour, the palette's first.

  coords:
    type: array
    description: |
      Two entries per key position, in position order: the key's x and then
      its y in hundredths of a key unit, on the whole board (both halves of a
      split, so a distance reads the same from either), at most 30000 each.
      canon: imprint.json, keymap-drawer's physical layout, times 100 (each
      key's top left corner; every key is one unit, so the offset to the
      centre cancels). For what measures the board (CONFIG_LANTERN_GEOMETRY:
      an effect, the gradient and the star waves), which asserts it twice
      the keymap's length. Without it the keyboard's chosen
      zmk,physical-layout (else its first) places the keys, each at its
      centre in the layout's hundredths of a key unit (a rotated key as if
      unrotated), and positions must name that layout's keys; a keyboard
      with neither fails the build where something measures the board. A
      target that measures nothing needs none.

  scatter-weights:
    type: array
    description: |
      One entry per palette slot (six): the percentage of this half's LEDs
      the slot takes in the scatter (CONFIG_LANTERN_SCATTER), at most 100
      in all (asserted). Slots 1.. take their rounded share and slot 0, the
      heaviest colour, the rest, so slot 0's own entry only documents the
      intent. canon t-skdt: 50 20 10 5 5 0 (the 10 the shares leave go to
      slot 0 too). A target without the scatter needs none.
