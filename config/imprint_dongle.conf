# The Imprint Dongle (the imprint_dongle shield of Cyboard's module, canon's
# split central) carries the palette's and the pick's central side: the
# behaviors with their resends (src/palette.c, src/effect.c) and the port
# (src/port.c). It has no
# lantern,rail node, so src/on_usb_power.c stays out, and imprint.conf's lines
# for the halves are undone here: this file merges after it.
CONFIG_ZMK_RGB_UNDERGLOW=n
CONFIG_LANTERN_KEYS=n
CONFIG_LANTERN_ON_USB_POWER=n

# The resends read the halves' battery reports (src/palette.c and
# src/effect.c assert this).
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# The run queue holds a whole palette and the pick for both halves at once:
# four invocations a half (src/effect.c asserts this too; ZMK's default is 5).
CONFIG_ZMK_SPLIT_BLE_CENTRAL_SPLIT_RUN_QUEUE_SIZE=8

# The port: the board's CDC ACM (zephyr boards/seeed/xiao_ble defaults it on
# with the USB device stack); written out so that the port file is known to
# be in this check build.
CONFIG_USB_CDC_ACM=y
CONFIG_LANTERN_PORT=y
