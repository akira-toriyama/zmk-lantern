name: Tools

# The unit tests of tools/ (lantern_port.py, the host's tool): standard
# library only, nothing to install, and no device, a pseudo-terminal standing
# for the port. On the macOS runner with /usr/bin/python3, the tool's floor
# (3.9, what a Mac ships), and on the Ubuntu runner with its python3; the two
# because the tool finds the device through ioreg on macOS and sysfs on
# Linux, one test listing the runner's own, and opens the port through
# termios on either. timeout-minutes: a regression in the tests' pseudo-
# terminal thread hung the suite on macOS once (a close waiting on a read).
on:
  # push only on main: a PR branch is checked once, through pull_request.
  push:
    branches: [main]
    paths:
      - "tools/**"
      - ".github/workflows/tools-test.yml"
  pull_request:
    paths:
      - "tools/**"
      - ".github/workflows/tools-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: python3
          - os: macos-latest
            python: /usr/bin/python3
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Test-only, never pushes.
          persist-credentials: false
      - name: Run the tests
        env:
          PYTHON: ${{ matrix.python }}
        run: |
          "$PYTHON" --version
          "$PYTHON" -m unittest discover -v -s tools -p 'test_*.py'
