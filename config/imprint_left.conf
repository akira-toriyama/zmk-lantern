# The left half: with Cyboard's stock roles it is the split central (canon's
# is a peripheral, its Imprint Dongle the central), so this check build
# compiles the palette's and the picks' resends here too (src/palette.c and
# src/pick.c assert the line). Not in imprint.conf: the right half, a
# peripheral, has no such option. Otherwise the module's defaults: the bands,
# the countdown and the bands intro, and no effect (config/imprint_right.conf
# builds canon's half).
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# The run queue holds a whole palette and all three picks for the one
# peripheral at once: six invocations, one over ZMK's default of 5 (src/pick.c
# asserts the line).
CONFIG_ZMK_SPLIT_BLE_CENTRAL_SPLIT_RUN_QUEUE_SIZE=6
