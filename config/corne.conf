# Read by corne_left and corne_right (ZMK reads the conf of every shield-name
# prefix): a consumer's half conf with every effect and both intros built,
# so that the check build measures the board from the physical layout
# (config/corne.overlay has no coords). Roles are ZMK's defaults for the
# shield (the left half is the split central). The rule, the rail-less
# variant (no lantern,rail node) and the keys are on by default from the
# lantern,keys node; the module paints the strip, so ZMK's underglow stays
# off (src/keys.c asserts this line; the shield leaves it off too).
CONFIG_ZMK_RGB_UNDERGLOW=n

CONFIG_LANTERN_THIN_RING=y
CONFIG_LANTERN_DISC=y
CONFIG_LANTERN_STAIN=y
CONFIG_LANTERN_CROSS_RING=y
CONFIG_LANTERN_BEAMS=y
CONFIG_LANTERN_WATER=y
CONFIG_LANTERN_DART=y
CONFIG_LANTERN_HELD=y
CONFIG_LANTERN_INTRO_STAR_WAVES=y
