# Read by both imprint_left and imprint_right (ZMK reads the conf of every
# shield-name prefix): the lines a consumer's half conf carries for the module.
# Roles are Cyboard's defaults (the left half is the split central); the
# module does not care, and the right half covers the split peripheral, where
# ZMK enables the USB device stack on nRF52840 without ZMK_USB. The rail and
# its node: config/imprint.overlay.

# ZMK's underglow lights the LEDs (Cyboard's module defaults it to y; said
# here so that the dependency is visible). The module drives the rail itself,
# so the underglow must not look for the ext_power device (ZMK's
# Kconfig.defaults sets EXT_POWER=y with the underglow), nor turn itself off
# and on with USB or idle, nor start at init with the rail off;
# src/on_usb_power.c asserts all four.
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=n
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=n
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n

# On by default with the lantern,rail node; written out so that a grep of
# build/*/zephyr/.config reads as intended.
CONFIG_LANTERN_ON_USB_POWER=y
