description: |
  The effect-next behavior (CONFIG_LANTERN_EFFECT_NEXT, src/effect_next.c):
  one node, in the keymap's behaviors or an overlay, bound to a key of the
  split central's keymap (`&effect_next`, no parameters). Each press picks the
  effect after the stored pick in src/effect.h's table, round again after the
  last, and keeps the pick's colour, through the effect behavior (the node
  effect), which carries it to every half. It runs on the central only, where
  the keymap runs, so its name is free of the split transport's 8 characters.

compatible: "lantern,behavior-effect-next"

include: zero_param.yaml
