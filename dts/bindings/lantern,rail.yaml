description: |
  The LED power rail that zmk-lantern switches with its rule
  (CONFIG_LANTERN_RAIL under CONFIG_LANTERN_ON_USB_POWER): one GPIO that
  enables the supply of the key LEDs, the pin the board's
  zmk,ext-power-generic node has as control-gpios. That node stays disabled
  on a target with this one, and there is at most one of these per target.
  Optional: without it the rule paints black where it would cut the power,
  and the supply stays the board's (ZMK's ext_power driver, or always on).

compatible: "lantern,rail"

include: base.yaml

properties:
  gpios:
    type: phandle-array
    required: true
    description: The rail's enable pin; the rail is on while the pin is active.

  settle-ms:
    type: int
    default: 100
    description: |
      Milliseconds between enabling the rail and the first frame to the LEDs,
      their power-up time. The zmk,ext-power-generic node's init-delay-ms
      (100 on the Cyboard assimilator-bt board).
