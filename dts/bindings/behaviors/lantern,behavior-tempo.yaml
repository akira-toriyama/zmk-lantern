description: |
  The tempo behavior (CONFIG_LANTERN_TEMPO_PICK, src/tempo.c): one node, named
  tempo, on the split central and on every half, in the keymap's behaviors or
  an overlay (a name of at most 8 characters, as the palette's). Never bound
  to a key: the central's code invokes it with the pick of the tempo, whether
  the effects run faster the faster the user types (param1 = one bit of
  src/tempo.h's, on or off, param2 = 0), and ZMK's split transport carries the
  same invocation to the halves by the node's name.

compatible: "lantern,behavior-tempo"

include: two_param.yaml
