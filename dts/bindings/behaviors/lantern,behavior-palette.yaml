description: |
  The palette behavior (CONFIG_LANTERN_PALETTE, src/palette.c): one node,
  named palette, on the split central and on every half, in the keymap's
  behaviors or an overlay. Never bound to a key: the central's code invokes
  it with one pair of slots (param1 = pair << 24 | the first slot's 0xRRGGBB,
  param2 = the second slot's), and ZMK's split transport carries the same
  invocation to the halves by the node's name.

compatible: "lantern,behavior-palette"

include: two_param.yaml
