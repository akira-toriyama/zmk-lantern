description: |
  The tempo behavior (CONFIG_LANTERN_TEMPO_PICK, src/tempo.c): one node, named
  tempo, on the central (a split's, or the keyboard itself when it is not a
  split) and on every half, in the keymap's behaviors or
  an overlay (a name of at most 8 characters, as the palette's). The
  central's code invokes it with the host's pick of the tempo, whether the
  effects run faster the faster the user types (param1 = one bit of
  src/tempo.h's, on or off, param2 = 0), and ZMK's split transport carries
  the same invocation to the halves by the node's name. A key of the
  central's keymap may bind it the same way (`&tempo 1 0`: the tempo on;
  `&tempo 2 0`: off), for a keyboard without a host; the key binding is
  unverified on hardware (the one consumer's keymap binds none).

compatible: "lantern,behavior-tempo"

include: two_param.yaml
