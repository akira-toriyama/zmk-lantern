name: Build

# Builds every target in build.yaml through the local reusable
# (.github/workflows/zmk-build.yml). The caller job is named `build` so the
# status check reads `build / Build (<board>, <shield>)`, which the main
# ruleset requires for both halves.

on:
  # Pull requests build once (pull_request); main builds once per push. The
  # push arm is limited to main so a PR branch is not built twice.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly: the manifest tracks zmk@main and zmk-keyboards@zephyr-4.1, so an
  # upstream break surfaces here before it surfaces in canon's build. A
  # failure notifies the repository owner without extra setup.
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/zmk-build.yml
