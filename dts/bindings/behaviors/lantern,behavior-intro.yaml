description: |
  The intro behavior (CONFIG_LANTERN_INTRO, src/intro.c): one node, named
  intro, on the split central and on every half, in the keymap's behaviors or
  an overlay (a name of at most 8 characters, as the palette's). Never bound
  to a key: the central's code invokes it with the pick of the intro, which of
  the intros built into a half's image the boot light plays (param1 = one bit
  of src/intro.h's, param2 = 0), and ZMK's split transport carries the same
  invocation to the halves by the node's name.

compatible: "lantern,behavior-intro"

include: two_param.yaml
