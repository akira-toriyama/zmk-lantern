description: |
  The intro behavior (CONFIG_LANTERN_INTRO, src/intro.c): one node, named
  intro, on the central (a split's, or the keyboard itself when it is not a
  split) and on every half, in the keymap's behaviors or
  an overlay (a name of at most 8 characters, as the palette's). The
  central's code invokes it with the host's pick of the intro, which of the
  intros built into a half's image the boot light plays (param1 = one bit of
  src/intro.h's, param2 = 0), and ZMK's split transport carries the same
  invocation to the halves by the node's name. A key of the central's keymap
  may bind it the same way (`&intro 2 0`: the star waves at the next boot
  light), for a keyboard without a host; the key binding is unverified on
  hardware (the one consumer's keymap binds none).

compatible: "lantern,behavior-intro"

include: two_param.yaml
