# The left half, the split central with the shield's roles: the palette's and
# the picks' resends read the half's battery reports (src/palette.c and
# src/pick.c assert the line). Not in corne.conf: the right half, a
# peripheral, has no such option.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# The run queue holds a whole palette and all three picks for the one
# peripheral at once: six invocations, one over ZMK's default of 5 (src/pick.c
# asserts the line).
CONFIG_ZMK_SPLIT_BLE_CENTRAL_SPLIT_RUN_QUEUE_SIZE=6

# The host's port (src/port.c), on by default with a CDC ACM port on a split
# central: config/corne_left.overlay adds the port the nice!nano's devicetree
# lacks, and USB_CDC_ACM needs SERIAL, which nothing else on this board turns
# on (its uart0 stays disabled, so no UART driver comes with it). The two
# defaults are written out so that a grep of build/corne_left/zephyr/.config
# reads as intended: a central half with the port, the consumer's shape
# without a dongle (the XIAO BLE's board gives all three, as the Imprint
# Dongle's build shows).
CONFIG_SERIAL=y
CONFIG_USB_CDC_ACM=y
CONFIG_LANTERN_PORT=y
