# The Reviung41, a keyboard that is not a split: a consumer's conf with every
# effect it can build and both intros, as config/corne.conf, and the host's
# port on the keyboard itself. The layer keys are a BLE split's (the split
# central computes the layer, src/layer.c), so the line is not here; the
# crossing ring builds without the hit and draws the keyboard's own presses
# across it. The module paints the strip, so ZMK's underglow stays off
# (src/keys.c asserts this line; the shield leaves it off too).
CONFIG_ZMK_RGB_UNDERGLOW=n

# The colours until a host hands a palette: read as a palette (src/keys.c).
CONFIG_LANTERN_COLOUR_0=0x2060FF
CONFIG_LANTERN_COLOUR_1=0xFF4000

CONFIG_LANTERN_THIN_RING=y
CONFIG_LANTERN_DISC=y
CONFIG_LANTERN_STAIN=y
CONFIG_LANTERN_CROSS_RING=y
CONFIG_LANTERN_BEAMS=y
CONFIG_LANTERN_WATER=y
CONFIG_LANTERN_DART=y
CONFIG_LANTERN_HEATMAP=y
CONFIG_LANTERN_INTRO_STAR_WAVES=y
CONFIG_LANTERN_TEMPO=y

# The host's port (src/port.c), on by default with a CDC ACM port on the
# device that runs the keymap: config/reviung41.overlay adds the port the
# nice!nano's devicetree lacks, and USB_CDC_ACM needs SERIAL. The defaults
# are written out so that a grep of build/reviung41/zephyr/.config reads as
# intended, as config/corne_left.conf does.
CONFIG_SERIAL=y
CONFIG_USB_CDC_ACM=y
CONFIG_LANTERN_PORT=y
