# The right half, a split peripheral as canon's halves both are: canon's
# lines for a half (its config/imprint_right.conf), so that the check build
# compiles what canon flashes and a change that breaks canon's halves fails
# here first: the no picture with the countdown off, both intros with the
# star waves the default, every effect with the crossing ring the default,
# and the tempo, over the rail (config/imprint.overlay). ZMK's sleep off, as
# canon's imprint.conf has it (Cyboard's shield turns it on), so that the
# wake builds too (CONFIG_LANTERN_WAKE_ON_HIT, off under ZMK_SLEEP). The
# left half keeps the module's defaults (config/imprint_left.conf).
CONFIG_ZMK_SLEEP=n

CONFIG_LANTERN_NO_PICTURE=y
CONFIG_LANTERN_COUNTDOWN=n
CONFIG_LANTERN_INTRO_BANDS=y
CONFIG_LANTERN_INTRO_STAR_WAVES=y
CONFIG_LANTERN_INTRO_DEFAULT_STAR_WAVES=y
CONFIG_LANTERN_THIN_RING=y
CONFIG_LANTERN_DISC=y
CONFIG_LANTERN_STAIN=y
CONFIG_LANTERN_CROSS_RING=y
CONFIG_LANTERN_BEAMS=y
CONFIG_LANTERN_WATER=y
CONFIG_LANTERN_DART=y
CONFIG_LANTERN_HEATMAP=y
CONFIG_LANTERN_LAYER_KEYS=y
CONFIG_LANTERN_EFFECT_DEFAULT_CROSS_RING=y
CONFIG_LANTERN_TEMPO=y
