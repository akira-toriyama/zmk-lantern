# The Imprint Dongle (the imprint_dongle shield of Cyboard's module, canon's
# split central) carries the palette's central side: the behavior with the
# resend (src/palette.c) and the port (src/palette_port.c). It has no
# lantern,rail node, so src/on_usb_power.c stays out, and imprint.conf's lines
# for the halves are undone here: this file merges after it.
CONFIG_ZMK_RGB_UNDERGLOW=n
CONFIG_LANTERN_KEYS=n
CONFIG_LANTERN_ON_USB_POWER=n

# The resend reads the halves' battery reports (src/palette.c asserts this).
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# The run queue holds a whole palette for both halves at once: three
# invocations a half (src/palette.c asserts this too; ZMK's default is 5).
CONFIG_ZMK_SPLIT_BLE_CENTRAL_SPLIT_RUN_QUEUE_SIZE=6

# The port: the board's CDC ACM (zephyr boards/seeed/xiao_ble defaults it on
# with the USB device stack); written out so that the port file is known to
# be in this check build.
CONFIG_USB_CDC_ACM=y
CONFIG_LANTERN_PALETTE_PORT=y
