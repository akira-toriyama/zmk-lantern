# Build matrix: the single source of board/shield pairs for CI
# (.github/workflows/zmk-build.yml) and the local build (scripts/build.sh), in
# ZMK's build.yaml include: form. Both halves of the Cyboard Imprint, the
# targets of the one consumer (canon) that carry the module, and its Imprint
# Dongle, the split central that carries the palette's and the picks' central
# side (src/palette.c, src/pick.c, src/port.c); and both halves of ZMK's own
# Corne shield on the nice!nano, a standard split with a physical layout and
# no LED rail, the check that the module builds for a keyboard that is not
# the Imprint with the least in its overlay (config/corne.overlay). The
# module has no shield or board of its own.
---
include:
  - board: assimilator-bt
    shield: imprint_left
  - board: assimilator-bt
    shield: imprint_right
  - board: xiao_ble/nrf52840/zmk
    shield: imprint_dongle
  - board: nice_nano/nrf52840/zmk
    shield: corne_left
  - board: nice_nano/nrf52840/zmk
    shield: corne_right
